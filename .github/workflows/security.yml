
name: Azure Cloud Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:

    name: Checkov Security Assessment

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install "checkov==3.3.15"

      - name: Scan secure Terraform configuration
        run: |
          checkov \
            --directory terraform/secure \
            --framework terraform \
            --check CKV2_AZURE_47